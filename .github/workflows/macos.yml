name: macOS build

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: Defconfig name
        required: true
        default: amethyst_defconfig
      steps:
        description: Steps to run
        type: choice
        options:
          - kernel
          - kernel payload
          - kernel userdata payload
        default: kernel
      xcode:
        description: Xcode version of the macos-26 image
        required: true
        default: "26.6"
      ipsw_url:
        description: IPSW URL (empty uses board.toml)
        required: false
        default: ""
      pre_build:
        description: Optional shell commands run in the UniXNU checkout
        required: false
        default: ""
      trust_cache_url:
        description: Trust cache bundle URL (optional)
        required: false
        default: ""
      owner_trust_cache:
        description: Treat the trust cache URL as an owner-signed bundle
        type: boolean
        default: false
      data_seed_url:
        description: Data seed URL (optional)
        required: false
        default: ""
      grow_gib:
        description: Grow the Data seed to this many GiB (optional)
        required: false
        default: ""
      skip_setup:
        description: Mark Setup as done in the Data seed
        type: boolean
        default: false
      upload_userdata:
        description: Upload the userdata image (large)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}-${{ inputs.defconfig }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
      DEFCONFIG: ${{ inputs.defconfig }}
      STEPS: ${{ inputs.steps }}
    steps:
      - name: Check out Device Repo
        uses: actions/checkout@v4

      - name: Check out UniXNU Core
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: unixnu-core
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the inputs
        id: check
        env:
          HAS_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID != '' }}
          OWNER_TRUST_CACHE: ${{ inputs.owner_trust_cache }}
          GROW_GIB: ${{ inputs.grow_gib }}
          SKIP_SETUP: ${{ inputs.skip_setup }}
        run: |
          trust_cache_url=$(jq -r '.inputs.trust_cache_url // ""' "$GITHUB_EVENT_PATH")
          data_seed_url=$(jq -r '.inputs.data_seed_url // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$trust_cache_url" ]; then echo "::add-mask::$trust_cache_url"; fi
          if [ -n "$data_seed_url" ]; then echo "::add-mask::$data_seed_url"; fi
          
          fail() { echo "::error::$1"; exit 1; }
          [ -f board.toml ] || fail "the device repository has no board.toml"
          [ -f "configs/$DEFCONFIG" ] || fail "configs/$DEFCONFIG not found"
          [ -d "$DEVELOPER_DIR" ] || fail "Xcode not found at $DEVELOPER_DIR"
          
          if [ -n "$GROW_GIB" ] && ! [[ "$GROW_GIB" =~ ^[0-9]+$ ]]; then fail "grow_gib must be a whole number"; fi
          if [ -n "$GROW_GIB" ] && [ -z "$data_seed_url" ]; then fail "grow_gib needs data_seed_url"; fi
          if [ "$SKIP_SETUP" = true ] && [ -z "$data_seed_url" ]; then fail "skip_setup needs data_seed_url"; fi
          if [ "$OWNER_TRUST_CACHE" = true ] && [ -z "$trust_cache_url" ]; then fail "owner_trust_cache needs trust_cache_url"; fi

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Report the runner toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --find mig
          clang --version | head -n 1
          python3 --version

      - name: Select the device
        working-directory: ./unixnu-core
        run: ./unixnu defconfig "$DEFCONFIG" -D "$GITHUB_WORKSPACE"

      - name: Prepare inputs
        if: contains(inputs.steps, 'payload')
        working-directory: ./unixnu-core
        env:
          GROW_GIB: ${{ inputs.grow_gib }}
        run: |
          trust_cache_url=$(jq -r '.inputs.trust_cache_url // ""' "$GITHUB_EVENT_PATH")
          data_seed_url=$(jq -r '.inputs.data_seed_url // ""' "$GITHUB_EVENT_PATH")
          
          if [ -n "$trust_cache_url" ]; then
            curl -fsSL --retry 3 "$trust_cache_url" -o "$RUNNER_TEMP/trustcache"
          fi
          if [ -n "$data_seed_url" ]; then
            curl -fsSL --retry 3 "$data_seed_url" -o "$RUNNER_TEMP/data.dbr"
            if [ -n "$GROW_GIB" ]; then
              git submodule update --init --depth 1 drivers/DarwinBoot
              mkdir -p build
              python3 scripts/seed-data-grow.py --gib "$GROW_GIB" "$RUNNER_TEMP/data.dbr" "$RUNNER_TEMP/data-grow.dbr"
              mv "$RUNNER_TEMP/data-grow.dbr" "$RUNNER_TEMP/data.dbr"
            fi
          fi

      - name: Run pre-build steps
        if: inputs.pre_build != ''
        working-directory: ./unixnu-core
        env:
          PRE_BUILD: ${{ inputs.pre_build }}
          DEVICE_DIR: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash -euo pipefail -c "$PRE_BUILD"

      - name: Build kernel
        working-directory: ./unixnu-core
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unixnu build kernel -D "$GITHUB_WORKSPACE"

      - name: Build userdata
        if: contains(inputs.steps, 'userdata')
        working-directory: ./unixnu-core
        run: ./unixnu build userdata -D "$GITHUB_WORKSPACE"

      - name: Build payload
        if: contains(inputs.steps, 'payload')
        working-directory: ./unixnu-core
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          SKIP_SETUP: ${{ inputs.skip_setup }}
          OWNER_TRUST_CACHE: ${{ inputs.owner_trust_cache }}
        run: |
          args=()
          if [ -f "$RUNNER_TEMP/trustcache" ]; then
            if [ "$OWNER_TRUST_CACHE" = true ]; then
              args+=(--owner-trust-cache "$RUNNER_TEMP/trustcache")
            else
              args+=(--trust-cache "$RUNNER_TEMP/trustcache")
            fi
          fi
          if [ -f "$RUNNER_TEMP/data.dbr" ]; then args+=(--data-ramdisk "$RUNNER_TEMP/data.dbr"); fi
          if [ "$SKIP_SETUP" = true ]; then args+=(--skip-setup); fi
          ./unixnu build payload "${args[@]}" -D "$GITHUB_WORKSPACE"

      - name: Upload compiled binaries
        if: success() && inputs.steps != 'kernel'
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-build-${{ inputs.defconfig }}
          path: |
            unixnu-core/out/*/kernel/**
            unixnu-core/out/*/payload/**
          if-no-files-found: error
          retention-days: 7

      - name: Collect the text logs
        id: logs
        if: always() && steps.check.outcome == 'success'
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import os, re, shutil, json
          from pathlib import Path
          source_root = Path('unixnu-core/out')
          target = Path(os.environ['RUNNER_TEMP']) / 'public-logs'
          shutil.rmtree(target, ignore_errors=True)
          target.mkdir(parents=True)
          
          event = Path(os.environ['GITHUB_EVENT_PATH']).read_text()
          inputs = json.loads(event).get('inputs', {})
          secrets = [os.environ.get('UNIXNU_UNIQUE_CHIP_ID', ''), inputs.get('trust_cache_url', ''), inputs.get('data_seed_url', '')]
          secrets = [v for v in secrets if v]
          
          count = 0
          for source in source_root.glob('*/logs'):
              if not source.is_dir(): continue
              for path in source.glob('*.log'):
                  data = path.read_bytes()
                  if b'\0' in data: continue
                  text = data.decode('utf-8', 'replace')
                  for value in secrets:
                      text = text.replace(value, '***')
                  text = re.sub(r'https?://[^\s"\']*[?&](?:token|sig|signature|key|X-Amz-Signature)=[^\s"\']*', '***', text, flags=re.I)
                  (target / path.name).write_text(text)
                  count += 1
          print(f'{count} text logs staged')
          PY

      - name: Upload build logs
        if: always() && steps.logs.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-logs-${{ inputs.defconfig }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-logs/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Remove proprietary inputs
        if: always()
        run: |
          rm -rf unixnu-core/out/ipsw unixnu-core/out/feeds $GITHUB_WORKSPACE/.cache/firmware unixnu-core/out/*/tree/.cache/firmware
          rm -f "$RUNNER_TEMP/trustcache" "$RUNNER_TEMP/data.dbr" "$RUNNER_TEMP/data-grow.dbr"