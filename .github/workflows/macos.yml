name: macOS build

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: Defconfig name
        required: true
        default: amethyst_defconfig
      steps:
        description: Steps to run
        type: choice
        options:
          - kernel
          - kernel payload
          - kernel userdata payload
        default: kernel
      xcode:
        description: Xcode version of the macos-26 image
        required: true
        default: "26.6"
      ipsw_url:
        description: IPSW URL (empty uses board.toml)
        required: false
        default: ""
      trust_cache_url:
        description: Trust cache bundle URL (optional)
        required: false
        default: ""
      owner_trust_cache:
        description: Treat the trust cache URL as an owner-signed bundle
        type: boolean
        default: false
      data_seed_url:
        description: Data seed URL (optional)
        required: false
        default: ""
      grow_gib:
        description: Grow the Data seed to this many GiB (optional)
        required: false
        default: ""
      skip_setup:
        description: Mark Setup as done in the Data seed
        type: boolean
        default: false
      upload_userdata:
        description: Upload the userdata image (large)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}-${{ inputs.defconfig }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
      DEFCONFIG: ${{ inputs.defconfig }}
      STEPS: ${{ inputs.steps }}
    steps:
      - name: Check out Device Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out UniXNU Core
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: unixnu-core
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      name: Patch offline component probes
        working-directory: ./unixnu-core
        run: |
          echo "Patching offline-component-load-probes.patch to bypass display probe..."
          find . -name "offline-component-load-probes.patch" -exec sed -i '' 's/native_legacy_display_probe();/\/\/ native_legacy_display_probe();/g' {} +
          find . -name "offline-component-load-probes.patch" -exec sed -i '' 's/native_legacy_display_late_probe();/\/\/ native_legacy_display_late_probe();/g' {} +

      - name: Select the device
        working-directory: ./unixnu-core
        run: ./unixnu defconfig "$DEFCONFIG" -D "$GITHUB_WORKSPACE"

      - name: Build kernel
        working-directory: ./unixnu-core
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unixnu build kernel -D "$GITHUB_WORKSPACE"

      - name: Build userdata
        if: contains(inputs.steps, 'userdata')
        working-directory: ./unixnu-core
        run: ./unixnu build userdata -D "$GITHUB_WORKSPACE"

      - name: Build payload
        if: contains(inputs.steps, 'payload')
        working-directory: ./unixnu-core
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          SKIP_SETUP: ${{ inputs.skip_setup }}
          OWNER_TRUST_CACHE: ${{ inputs.owner_trust_cache }}
        run: |
          args=()
          if [ -f "$RUNNER_TEMP/trustcache" ]; then
            if [ "$OWNER_TRUST_CACHE" = true ]; then
              args+=(--owner-trust-cache "$RUNNER_TEMP/trustcache")
            else
              args+=(--trust-cache "$RUNNER_TEMP/trustcache")
            fi
          fi
          if [ -f "$RUNNER_TEMP/data.dbr" ]; then args+=(--data-ramdisk "$RUNNER_TEMP/data.dbr"); fi
          if [ "$SKIP_SETUP" = true ]; then args+=(--skip-setup); fi
          ./unixnu build payload "${args[@]}" -D "$GITHUB_WORKSPACE"

      - name: Upload compiled binaries
        if: success() && inputs.steps != 'kernel'
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-build-${{ inputs.defconfig }}
          path: |
            unixnu-core/out/*/kernel/**
            unixnu-core/out/*/payload/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-logs-${{ inputs.defconfig }}-${{ github.run_attempt }}
          path: unixnu-core/out/*/logs/*.log
          if-no-files-found: warn
          retention-days: 7